[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "staff-video"
version = "0.1.0"
description = "Local, tag-evidence-based staff video inspection"
requires-python = ">=3.9,<3.13"
dependencies = [
  "numpy==2.0.2", "opencv-python==4.13.0.92", "pandas==2.3.3",
  "PyYAML==6.0.3", "ultralytics==8.3.221", "torch==2.4.1",
  "torchvision==0.19.1", "lap==0.5.12", "streamlit==1.50.0",
  "plotly==6.3.1", "imageio-ffmpeg==0.6.0", "Pillow==11.3.0",
  "scipy==1.13.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
staff-video = "staff_video.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
